# Einstellungen für den Earnings-Kalender

kalender:
  name: "Earnings Watchlist"
  # Wie lange vergangene Earnings im Kalender bleiben (Tage)
  vergangene_tage: 120
  # Wie weit in die Zukunft Termine angezeigt werden (Tage)
  zukunft_tage: 120
  # Erinnerung vor dem Termin (Minuten vor 00:00 des Termintags), leer = keine.
  # Hinweis: Apple ignoriert Erinnerungen in Abos, wenn "Hinweise entfernen" aktiv ist.
  erinnerung_minuten: 840        # 840 = Vortag 10:00
  # Welche CRV-Variante im Titel steht: A, B oder C
  crv_im_titel: "A"
  # Link im Termin (TradingView-Chart)
  chart_link: true

technik:
  rsi_periode: 14
  atr_periode: 14
  volumen_schnitt_tage: 20
  # Swing-Hochs/-Tiefs: Kerzen links/rechts, die niedriger/höher sein müssen
  swing_fenster: 5
  # Kursmarken, die näher als x % beieinander liegen, werden zusammengefasst
  marken_cluster_prozent: 1.5

crv:
  # A = Struktur: Stop unter letztem Swing-Tief, Ziel am nächsten Widerstand
  a_stop_puffer_prozent: 0.5
  # B = Volatilität: Stop = Kurs - x * ATR, Ziel am nächsten Widerstand
  b_atr_faktor: 1.5
  # C = Pullback: Einstieg an Unterstützung (SMA20/50/Swing-Tief), Stop = Einstieg - x * ATR
  c_atr_faktor: 1.0
  c_max_abstand_prozent: 15
  # Ziel muss mindestens x * ATR über dem Einstieg liegen (zu nahe Widerstände überspringen)
  ziel_min_atr: 1.0
  # Am Allzeithoch (kein Widerstand darüber): Ziel = Kurs + x * ATR
  ath_ziel_atr: 3.0

daten:
  # Pause zwischen Yahoo-Abfragen in Sekunden (gegen Sperren)
  pause_sekunden: 0.4
  historie: "2y"
