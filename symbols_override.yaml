# Zuordnung TradingView-Symbol -> Yahoo-Finance-Symbol
#
# Wofür? US-Werte (NASDAQ/NYSE/AMEX/OTC) werden automatisch erkannt.
# Bei deutschen Zweitlistings (Tradegate, Gettex, L&S) liefert Yahoo oft keine
# Earnings-Termine. Dann besser auf die HEIMATBÖRSE des Unternehmens zeigen,
# denn dort werden die Zahlen veröffentlicht.
#
# Format:
#   "BÖRSE:TICKER": YAHOO-SYMBOL
#   "BÖRSE:TICKER": skip              # Wert ignorieren
#   "BÖRSE:TICKER": {yahoo: SYMBOL, hinweis: "Text"}
#
# Yahoo-Suffixe: .DE Xetra · .F Frankfurt · .VI Wien · .L London · .PA Paris
#   .AS Amsterdam · .HE Helsinki · .HK Hongkong · .SS Shanghai · .KS Korea
#   .AX Australien · .TO Toronto · (kein Suffix = USA)
#
# Unten: Entwurf von Claude – Einträge mit "prüfen" bitte kontrollieren.

"GETTEX:HY9H": {yahoo: "000660.KS", hinweis: "SK hynix (Heimatbörse Korea) – prüfen"}
"TRADEGATE:NOA3": {yahoo: "NOKIA.HE", hinweis: "Nokia (Heimatbörse Helsinki)"}
"TRADEGATE:NNND": {yahoo: "0700.HK", hinweis: "Tencent (Heimatbörse Hongkong) – prüfen"}
"GETTEX:R6C0": {yahoo: "SHEL", hinweis: "Shell (US-ADR, beste Earnings-Daten) – prüfen"}
"GETTEX:LYI": {yahoo: "LYC.AX", hinweis: "Lynas Rare Earths (Heimatbörse ASX) – prüfen"}
"XETR:4DS": {yahoo: "4DS.AX", hinweis: "4DS Memory (Heimatbörse ASX) – prüfen"}

