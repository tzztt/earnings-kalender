# Hyperscaler / Großkunden -> Zulieferer bzw. Vertragspartner aus der Watchlist
#
# Wirkung im Kalender:
#   * Beim Kunden-Termin (z. B. MSFT) steht, welche Zulieferer betroffen sind.
#   * Beim Zulieferer-Termin (z. B. VRT) stehen die Earnings-Termine seiner Kunden,
#     damit du siehst, welche Kunden VORHER berichten.
#
# Schlüssel = Ticker des Kunden. Steht der Kunde nicht in der Watchlist, wird er
# automatisch zusätzlich abgefragt (yahoo: Symbol angeben, falls nicht US).
# Zulieferer = Ticker wie in der Watchlist (ohne Börse) oder komplett "BÖRSE:TICKER".
#
# ENTWURF von Claude auf Basis öffentlicher Berichte (Stand ca. Mitte 2026).
# Beziehungen ändern sich – bitte prüfen und ergänzen.

